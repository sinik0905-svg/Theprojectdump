<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PennyPilot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💰 PennyPilot</h1>

        <p>Track your expenses easily</p>

        <input
            type="text"
            id="expenseName"
            placeholder="Expense name"
        >

        <input
            type="number"
            id="expenseAmount"
            placeholder="Amount"
        >

        <button onclick="addExpense()">
            Add Expense
        </button>


        <h2>My Expenses</h2>

        <div id="expenseList"></div>


        <h2>
            Total:
            ₹<span id="total">0</span>
        </h2>

    </div>


    <script src="script.js"></script>

</body>

</html>
